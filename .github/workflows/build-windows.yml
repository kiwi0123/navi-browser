name: Build Windows exe

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 PyQt6-WebEngine pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --windowed --name NaviBrowser n_main.py

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/NaviBrowser -DestinationPath NaviBrowser-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: NaviBrowser-windows
          path: NaviBrowser-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: NaviBrowser-windows.zip
